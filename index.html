<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>狡兔三窟：全球策略家｜誇張音效強化版 V3.5</title>
<style>
:root{
  --bg:#f6f8fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d7e0ea;
  --accent:#5b6ee1;--accent2:#159a80;--good:#16794f;--bad:#b83232;--soft:#f3f6ff;
  --shadow:0 12px 30px rgba(22,32,51,.09)
}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#fafcff,#eef3f8);color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.wrap{max-width:1180px;margin:auto;padding:16px}
.top{position:sticky;top:0;z-index:10;background:rgba(250,252,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:auto;padding:11px 16px;display:grid;grid-template-columns:1fr 1.35fr;gap:12px;align-items:center}
.brand{font-weight:900;font-size:clamp(21px,3.4vw,31px)}.sub{color:var(--muted);font-size:13px}
.resources{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.res{background:#fff;border:1px solid var(--line);border-radius:13px;padding:7px;text-align:center}.res b{display:block;font-size:18px}.res small{font-size:11px;color:var(--muted)}
.progressrow{display:flex;gap:9px;align-items:center;margin-top:7px}.progress{height:9px;background:#e8edf3;border-radius:99px;overflow:hidden;flex:1}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}.badge{font-size:12px;background:#fff;border:1px solid var(--line);padding:5px 9px;border-radius:99px}
.panel{background:#fff;border:1px solid var(--line);border-radius:23px;padding:clamp(18px,3vw,30px);box-shadow:var(--shadow)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center}.hero h1{font-size:clamp(34px,5.5vw,60px);line-height:1.05;margin:0 0 12px}.hero p,.lead{font-size:17px;line-height:1.8;color:#475467}.bigicon{font-size:clamp(88px,15vw,170px);text-align:center}
.kicker{font-size:14px;font-weight:900;color:var(--accent);letter-spacing:.08em;margin-bottom:6px}.sectionTitle{font-size:clamp(28px,4vw,42px);margin:0 0 8px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:14px;padding:12px 17px;font-weight:800;min-height:46px}.primary{background:var(--accent);color:#fff}.secondary{background:#edf1f7;color:var(--ink)}.ghost{background:#fff;border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cardgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:2px solid var(--line);border-radius:16px;background:#fff;padding:15px;text-align:left}.card:hover{border-color:#afbaff}.card.selected{border-color:var(--accent);background:var(--soft)}.card strong{display:block;font-size:17px;margin-bottom:5px}.card span{font-size:14px;line-height:1.5;color:#475467}
.callout{background:#f4f7ff;border-left:5px solid var(--accent);border-radius:13px;padding:14px 16px;line-height:1.75;margin:15px 0}.feedback{background:#fafcff;border:1px solid var(--line);border-radius:14px;padding:15px;line-height:1.75;margin-top:15px}.hidden{display:none!important}
.field{margin:11px 0}label{display:block;font-weight:700;font-size:14px;margin-bottom:5px}input[type=text],input[type=number],textarea,select{width:100%;padding:12px;border:1px solid #cad5e1;border-radius:12px;background:#fff}textarea{min-height:88px;resize:vertical}
.sliderRow{display:grid;grid-template-columns:140px 1fr 65px;gap:10px;align-items:center;margin:11px 0}input[type=range]{width:100%}
.issueGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.issue{border:2px solid var(--line);background:#fff;border-radius:14px;padding:13px;text-align:left}.issue.active{border-color:var(--accent2);background:#edfdf8}
.delta{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:6px 9px;background:#eef2f6;border-radius:99px;font-size:13px}.good{color:var(--good);font-weight:800}.bad{color:var(--bad);font-weight:800}
.status{padding:12px 14px;border-radius:13px;margin-top:14px}.status.ok{background:#eaf8f1;color:#0d653e}.status.err{background:#fff0f0;color:#9b1c1c}.status.info{background:#eef4ff;color:#354acb}
.tablewrap{overflow:auto;margin-top:14px}.table{width:100%;border-collapse:collapse;min-width:950px}.table th,.table td{border:1px solid var(--line);padding:9px;text-align:left;vertical-align:top;font-size:13px}.table th{background:#f6f9fc;position:sticky;top:0}
.bars{display:grid;gap:9px}.barrow{display:grid;grid-template-columns:150px 1fr 44px;gap:8px;align-items:center}.bar{height:11px;background:#e9eef4;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#6a7cf0,#17a589)}
.summaryGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:15px}.box{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fbfcfe}.box h3{margin:0 0 10px}
.small{font-size:13px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;padding:18px 0 36px}

.teacherLock{display:inline-flex;align-items:center;gap:7px}
.dashboardTop{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}
.metric{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fbfcfe}
.metric small{display:block;color:var(--muted);margin-bottom:4px}
.metric b{font-size:26px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:14px 0}
.toolbar .field{margin:0;min-width:160px;flex:1}
.switchLabel{display:flex;align-items:center;gap:8px;font-weight:700;margin:0;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
.liveDot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#98a2b3;margin-right:6px}
.liveDot.on{background:#12b76a;box-shadow:0 0 0 4px rgba(18,183,106,.12)}
.notice{border:1px solid #f1d48a;background:#fff9e8;color:#7a5511;border-radius:13px;padding:12px 14px;margin:12px 0}
.studentCard{border:1px solid var(--line);border-radius:15px;padding:12px;background:#fff;margin:8px 0}
.detailGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.detailItem{background:#f8fafc;border-radius:11px;padding:10px}
.detailItem small{display:block;color:var(--muted);margin-bottom:3px}
.detailItem b{font-size:14px;word-break:break-word}
.dialogBack{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{width:min(760px,100%);max-height:85vh;overflow:auto;background:#fff;border-radius:22px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.24)}
.dialog h3{margin-top:0}
.unsubmitted{display:flex;flex-wrap:wrap;gap:7px}.unsubmitted .pill{background:#fff4e5}

.animStage{position:relative;overflow:hidden;border:2px solid var(--line);border-radius:24px;background:radial-gradient(circle at 50% 35%,#ffffff 0%,#f6f8fc 58%,#edf2f7 100%);min-height:430px;padding:28px;margin:18px 0;box-shadow:0 18px 45px rgba(22,32,51,.12)}
.animCenter{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:365px;text-align:center}
.animTitle{font-size:clamp(44px,8vw,86px);font-weight:1000;line-height:1.1;margin:10px 0;letter-spacing:.02em}
.animSub{font-size:clamp(18px,2.5vw,27px);color:#475467;line-height:1.65;font-weight:700}
.bondPile{position:relative;width:min(680px,92%);height:170px;margin:10px auto 0}
.bond{width:150px;height:92px;border:3px solid #bdc6d1;border-radius:12px;background:linear-gradient(180deg,#fff,#f3f4f6);position:absolute;box-shadow:0 10px 22px rgba(0,0,0,.12);transform-origin:center bottom}
.bond:nth-child(1){left:8%;top:34px;transform:rotate(-12deg)}.bond:nth-child(2){left:30%;top:10px;transform:rotate(-4deg)}.bond:nth-child(3){right:30%;top:8px;transform:rotate(5deg)}.bond:nth-child(4){right:8%;top:36px;transform:rotate(13deg)}
.bond:before,.bond:after{content:"";position:absolute;left:18px;right:18px;height:5px;background:#d1d7df;border-radius:3px}.bond:before{top:27px}.bond:after{top:52px}
.fire{font-size:clamp(110px,18vw,190px);line-height:1;animation:firePulse .52s ease-in-out infinite alternate;filter:drop-shadow(0 18px 22px rgba(255,86,0,.35));margin-top:-48px;z-index:4}
.burn .bond:nth-child(1){animation:burnBond 2.1s .1s ease forwards}.burn .bond:nth-child(2){animation:burnBond 2.1s .35s ease forwards}.burn .bond:nth-child(3){animation:burnBond 2.1s .6s ease forwards}.burn .bond:nth-child(4){animation:burnBond 2.1s .85s ease forwards}
.smoke{position:absolute;font-size:54px;opacity:0;animation:smokeRise 2s ease-out forwards;z-index:5}
.alertScene{background:radial-gradient(circle at center,#fff8f8 0%,#ffe8e8 60%,#ffdada 100%);border-color:#f0a7a7}
.alertIcon{font-size:clamp(120px,20vw,210px);line-height:1;opacity:0;animation:sirenDrop .55s cubic-bezier(.17,.89,.32,1.49) forwards, sirenShake .22s .7s linear 4}
.alertBox{font-size:clamp(42px,8vw,88px);font-weight:1000;line-height:1.12;color:#981b1b;padding:18px 26px;border-radius:22px;background:#fff;border:4px solid #dd3b3b;box-shadow:0 0 0 0 rgba(221,59,59,.2);transform:scale(.62);opacity:0;animation:alertPop .7s .25s cubic-bezier(.18,.89,.32,1.35) forwards, alertPulse 1s 1s ease-in-out 3}
.alertSub{font-size:clamp(20px,3vw,32px);font-weight:800;color:#7f1d1d;margin-top:20px;opacity:0;animation:quoteIn .55s .8s ease-out forwards}
.rabbitScene{background:radial-gradient(circle at 50% 35%,#fffdf4 0%,#f9f6e8 55%,#eef5ee 100%);border-color:#d7cf9a}
.rabbitRow{display:flex;gap:clamp(22px,5vw,60px);justify-content:center;align-items:flex-end;font-size:clamp(100px,17vw,180px);margin:8px 0 18px}
.rabbitRow span{opacity:0;transform:translateY(100px) scale(.55) rotate(-8deg);animation:rabbitBounceIn .72s cubic-bezier(.17,.89,.32,1.49) forwards}
.rabbitRow span:nth-child(2){animation-delay:.35s}.rabbitRow span:nth-child(3){animation-delay:.7s}
.quoteReveal{opacity:0;transform:scale(.7);animation:quoteZoom .8s 1.05s cubic-bezier(.18,.89,.32,1.25) forwards;font-size:clamp(38px,7vw,78px);font-weight:1000;line-height:1.28;color:#2f3b2f;text-wrap:balance;max-width:1000px}
.caveGlow{position:absolute;width:150px;height:80px;border-radius:50%;background:rgba(132,180,126,.18);filter:blur(3px);bottom:42px;opacity:0;animation:glowIn .7s forwards}
.caveGlow.g1{left:20%;animation-delay:.15s}.caveGlow.g2{left:44%;animation-delay:.5s}.caveGlow.g3{right:20%;animation-delay:.85s}
.worldToSelf{display:flex;align-items:center;justify-content:center;gap:14px;font-size:52px;margin:8px 0 18px}.worldToSelf .arrow{font-size:32px;animation:arrowFlow 1s ease-in-out infinite alternate}
.youthGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.youthBtn{border:2px solid var(--line);background:#fff;border-radius:15px;padding:14px;text-align:left;font-weight:800}.youthBtn.active{border-color:var(--accent2);background:#edfdf8}.youthResult{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.youthHole{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fbfcfe;text-align:center}.youthHole .num{font-size:13px;color:var(--muted);margin-bottom:6px}.youthHole .val{font-size:20px;font-weight:900}
@keyframes firePulse{from{transform:scale(.9) rotate(-4deg)}to{transform:scale(1.12) rotate(4deg)}}
@keyframes burnBond{0%{opacity:1;filter:none}32%{filter:sepia(.7) saturate(2);transform:translateY(-8px) scale(1.03) rotate(2deg)}70%{filter:sepia(1) saturate(5) brightness(.75);opacity:.75}100%{opacity:0;filter:blur(3px) sepia(1);transform:translateY(-100px) scale(.55) rotate(18deg)}}
@keyframes smokeRise{0%{opacity:0;transform:translateY(35px) scale(.7)}25%{opacity:.9}100%{opacity:0;transform:translateY(-160px) scale(1.55)}}
@keyframes sirenDrop{0%{opacity:0;transform:translateY(-120px) scale(.4)}70%{opacity:1;transform:translateY(10px) scale(1.08)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes sirenShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes alertPop{0%{opacity:0;transform:scale(.62)}75%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes alertPulse{0%,100%{box-shadow:0 0 0 0 rgba(221,59,59,.12)}50%{box-shadow:0 0 0 24px rgba(221,59,59,.07)}}
@keyframes rabbitBounceIn{0%{opacity:0;transform:translateY(100px) scale(.55) rotate(-8deg)}65%{opacity:1;transform:translateY(-20px) scale(1.12) rotate(3deg)}82%{transform:translateY(8px) scale(.96) rotate(-1deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
@keyframes quoteZoom{0%{opacity:0;transform:scale(.7)}75%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes quoteIn{to{opacity:1;transform:translateY(0)}}
@keyframes glowIn{to{opacity:1;transform:scale(1.2)}}
@keyframes arrowFlow{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
@media(prefers-reduced-motion:reduce){.fire,.burn .bond,.smoke,.alertBox,.alertPulse,.rabbitRow span,.quoteReveal,.worldToSelf .arrow{animation:none!important;opacity:1!important;transform:none!important}}

.soundToggleWrap{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:8px}
.soundToggle{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.soundToggle.on{background:#edfdf8;border-color:#9ddbcf}
.soundHint{font-size:12px;color:var(--muted)}

@media(max-width:800px){.dashboardTop{grid-template-columns:repeat(2,1fr)}.detailGrid{grid-template-columns:1fr}}

@media(max-width:800px){.topin,.hero,.grid2,.summaryGrid{grid-template-columns:1fr}.resources{grid-template-columns:repeat(5,1fr)}.grid3,.cardgrid,.issueGrid{grid-template-columns:1fr}.sliderRow{grid-template-columns:100px 1fr 55px}.barrow{grid-template-columns:100px 1fr 35px}}
</style>
</head>
<body>
<div class="top">
  <div class="topin">
    <div>
      <div class="brand">🐇 狡兔三窟：全球策略家</div>
      <div class="sub">誇張音效強化版 V3.5｜Google 試算表 × Apps Script</div>
      <div class="progressrow"><div class="progress"><span id="progressBar"></span></div><div class="badge" id="stageBadge">首頁</div></div>
      <div class="soundToggleWrap">
        <button type="button" class="soundToggle on" id="soundToggleBtn">🔊 音效開啟</button>
        <span class="soundHint">可隨時切換</span>
      </div>
    </div>
    <div class="resources">
      <div class="res">💰<b id="money">80</b><small>財富</small></div>
      <div class="res">❤️<b id="people">20</b><small>民心</small></div>
      <div class="res">👑<b id="rep">70</b><small>聲望</small></div>
      <div class="res">🤝<b id="rel">30</b><small>關係</small></div>
      <div class="res">🏛️<b id="root">10</b><small>根基</small></div>
    </div>
  </div>
</div>

<div class="wrap">
  <section id="screen" class="panel"></section>
  <footer>學生送出資料後寫入 Google 試算表「記錄」工作表；教師端需密碼登入，並可即時讀取全班結果。</footer>
</div>

<script>
/* =========================================================
   完成 Apps Script Web App 部署後，只要修改下面這一行。
   範例：
   const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/XXXXXXXX/exec';
   ========================================================= */
const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz3EsKV4rdA9I2CkE7OMKkBtENgsM4ZXf5vghd8C-fqi786vtKj16ish4X-0Vek6dZ5/exec';

(() => {
const screen = document.getElementById('screen');
const stages = ['首頁','學生資料','序章','第一窟','危機','第二窟','第三窟','跨文化','全球談判','Boss 關','青春三窟','第四窟','提交'];
const state = {
  stage:0, mode:'student',
  student:{className:'',seat:'',name:''},
  money:80,people:20,rep:70,rel:30,root:10,
  answers:{},
  scores:{long:0,empathy:0,culture:0,negotiate:0,global:0,action:0},
  submitted:false,
  sound:true
};

const teacherState = {
  token:'',
  autoRefresh:false,
  refreshSeconds:10,
  timer:null,
  lastPayload:null
};

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function clamp(n){return Math.max(0,Math.min(100,n))}
function sync(){
  ['money','people','rep','rel','root'].forEach(k=>document.getElementById(k).textContent=Math.round(state[k]));
  document.getElementById('progressBar').style.width=`${Math.min(100,state.stage/(stages.length-1)*100)}%`;
  document.getElementById('stageBadge').textContent=stages[state.stage]||'完成';
  syncSoundButton();
}
function delta(d){Object.entries(d).forEach(([k,v])=>state[k]=clamp(state[k]+v));sync()}
function score(d){Object.entries(d).forEach(([k,v])=>state.scores[k]+=v)}
function next(){state.stage++;sync();render();window.scrollTo({top:0,behavior:'smooth'})}
function setNext(id,fn=next){const el=document.getElementById(id);if(el)el.onclick=fn}
function revealNextButton(id,delay=2000,fn=next){const el=document.getElementById(id);if(!el)return;el.style.opacity='0';el.style.pointerEvents='none';el.setAttribute('aria-hidden','true');setTimeout(()=>{el.style.transition='opacity .45s ease';el.style.opacity='1';el.style.pointerEvents='auto';el.removeAttribute('aria-hidden');el.onclick=fn;},delay)}
function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
}
function isConfigured(){return GAS_WEB_APP_URL && !GAS_WEB_APP_URL.includes('XXXXXXX')}

function getAudioContext(){
  if(!window.__gameAudioCtx){
    const A=window.AudioContext||window.webkitAudioContext;
    if(!A) return null;
    window.__gameAudioCtx=new A();
  }
  if(window.__gameAudioCtx.state==='suspended'){
    window.__gameAudioCtx.resume().catch(()=>{});
  }
  return window.__gameAudioCtx;
}
function tone(freq=440,dur=.08,type='sine',gain=.075,delay=0){
  if(!state.sound) return;
  const ctx=getAudioContext(); if(!ctx) return;
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.value=freq;o.connect(g);g.connect(ctx.destination);
  const t=ctx.currentTime+delay;
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(gain,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.start(t);o.stop(t+dur+.02);
}
function chord(notes,dur=.22,type='sine',gain=.055){
  notes.forEach((f,i)=>tone(f,dur,type,gain,i*.015));
}
function sfx(name){
  if(!state.sound) return;
  switch(name){
    case 'click':
      tone(720,.07,'triangle',.04);
      break;

    case 'select':
      tone(540,.08,'triangle',.05);
      tone(760,.11,'triangle',.045,.05);
      break;

    case 'confirm':
      tone(480,.08,'sine',.055);
      tone(640,.10,'sine',.055,.06);
      tone(840,.12,'sine',.06,.13);
      tone(1080,.18,'sine',.055,.22);
      break;

    case 'warning':
      tone(980,.20,'sawtooth',.085);
      tone(700,.20,'sawtooth',.085,.18);
      tone(980,.20,'sawtooth',.085,.36);
      tone(520,.38,'square',.045,.55);
      break;

    case 'fire':
      tone(120,.70,'sawtooth',.055);
      tone(165,.55,'triangle',.05,.08);
      tone(230,.38,'sawtooth',.045,.20);
      tone(95,.85,'square',.035,.30);
      tone(320,.22,'triangle',.035,.55);
      break;

    case 'success':
      chord([523.25,659.25,783.99],.34,'sine',.05);
      tone(1046.5,.22,'sine',.06,.20);
      tone(1318.5,.28,'sine',.055,.36);
      break;

    case 'rabbit':
      tone(360,.09,'triangle',.045);
      tone(520,.10,'triangle',.05,.16);
      tone(700,.11,'triangle',.055,.32);
      tone(880,.12,'triangle',.06,.50);
      chord([523.25,659.25,783.99,1046.5],.38,'sine',.05);
      tone(1318.5,.26,'sine',.055,.72);
      break;

    case 'boss':
      tone(130,.18,'square',.055);
      tone(164.81,.18,'square',.055,.13);
      tone(196,.18,'square',.06,.26);
      tone(246.94,.22,'square',.06,.39);
      chord([392,493.88,587.33],.38,'triangle',.05);
      tone(783.99,.30,'sine',.06,.58);
      break;

    case 'youth':
      tone(330,.12,'sine',.04);

  <p class="lead">${esc(state.student.className)} ${esc(state.student.seat)} 號 ${esc(state.student.name)}，請確認後將結果寫入 Google 試算表。</p>
  <div class="grid2">
    <div class="box">
      <h3>核心選擇</h3>
      <p>第一印象：${esc(state.answers.firstImpression||'')}</p>
      <p>第一窟：${esc(state.answers.cave1||'')}</p>
      <p>第二窟：${esc(state.answers.cave2||'')}</p>
      <p>跨文化：${esc(state.answers.culture||'')}</p>
      <p>人類三窟：${(state.answers.boss||[]).map(esc).join('、')}</p>
    </div>
    <div class="box">
      <h3>最終資源</h3>
      <div class="delta"><span class="pill">💰 ${state.money}</span><span class="pill">❤️ ${state.people}</span><span class="pill">👑 ${state.rep}</span><span class="pill">🤝 ${state.rel}</span><span class="pill">🏛️ ${state.root}</span></div>
      <p><b>我的青春三窟：</b>${(state.answers.youthCaves||[]).map(esc).join('、')}</p><p><b>我的第四窟：</b>${esc(state.answers.action||'')}</p>
    </div>
  </div>
  <div id="submitStatus" class="${isConfigured()?'status info':'status err'}">
    ${isConfigured()?'尚未提交。':'尚未設定 Apps Script Web App URL。請先修改 HTML 中的 GAS_WEB_APP_URL。'}
  </div>
  <div class="btnrow">
    <button class="btn primary" id="cloudSubmit" ${isConfigured()?'':'disabled'}>提交到 Google 試算表</button>
    <button class="btn ghost" id="restart">重新開始</button>
  </div>`;
  document.getElementById('restart').onclick=()=>location.reload();
  document.getElementById('cloudSubmit').onclick=submitToCloud;
}

function buildPayload(){
  const a=state.answers.allocation||{};
  return {
    action:'submit',
    submissionId:uuid(),
    className:state.student.className,
    seat:state.student.seat,
    name:state.student.name,
    firstImpression:state.answers.firstImpression||'',
    cave1:state.answers.cave1||'',
    cave2:state.answers.cave2||'',
    gold:a.gold||0,army:a.army||0,house:a.house||0,temple:a.temple||0,welfare:a.welfare||0,diplomacy:a.diplomacy||0,
    culture:state.answers.culture||'',
    country:state.answers.country||'',
    position:state.answers.position||'',
    needs:state.answers.needs||'',
    commonGround:state.answers.commonGround||'',
    solution:state.answers.solution||'',
    boss:(state.answers.boss||[]).join('｜'),
    bossReason:state.answers.bossReason||'',
    youthCaves:(state.answers.youthCaves||[]).join('｜'),
    globalAction:state.answers.action||'',
    money:state.money,people:state.people,rep:state.rep,rel:state.rel,root:state.root,
    longScore:state.scores.long,empathyScore:state.scores.empathy,cultureScore:state.scores.culture,
    negotiateScore:state.scores.negotiate,globalScore:state.scores.global,actionScore:state.scores.action,
    userAgent:navigator.userAgent
  };
}

async function submitToCloud(){
  const btn=document.getElementById('cloudSubmit'),status=document.getElementById('submitStatus');
  btn.disabled=true;btn.textContent='提交中…';status.className='status info';status.textContent='正在寫入 Google 試算表…';
  try{
    const payload=buildPayload();
    const res=await fetch(GAS_WEB_APP_URL,{
      method:'POST',
      redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data.ok) throw new Error(data.message||'Apps Script 回傳失敗');
    state.submitted=true;sfx('submit');
    status.className='status ok';status.innerHTML=`✅ 提交成功！<br>伺服器時間：${esc(data.timestamp||'')}<br>資料列：${esc(data.row||'')}`;
    btn.textContent='已提交';btn.disabled=true;
  }catch(err){
    sfx('warning');status.className='status err';status.innerHTML=`❌ 提交失敗：${esc(err.message)}<br><span class="small">請確認 Web App URL、部署權限與網路連線。</span>`;
    btn.textContent='重新提交';btn.disabled=false;
  }
}

function teacherLogin(){
  state.mode='teacher';state.stage=0;sync();
  stopAutoRefresh();
  screen.innerHTML=`
  <div class="kicker">TEACHER ACCESS｜教師驗證</div>
  <h2 class="sectionTitle">🔐 教師登入</h2>
  <p class="lead">教師端資料受到 Apps Script 後端驗證保護。學生即使點到這個入口，也必須通過教師密碼驗證才能讀取填答資料。</p>
  <div class="grid2">
    <div>
      <div class="field"><label>教師密碼</label><input id="teacherPassword" type="password" autocomplete="current-password" placeholder="請輸入教師密碼"></div>
      <div class="btnrow">
        <button class="btn primary" id="teacherLoginBtn" ${isConfigured()?'':'disabled'}>登入教師端</button>
        <button class="btn ghost" id="homeBtn">返回首頁</button>
      </div>
      <div id="loginStatus" class="${isConfigured()?'status info':'status err'}">${isConfigured()?'尚未登入。':'尚未設定 GAS_WEB_APP_URL。'}</div>
    </div>
    <div class="box">
      <h3>安全機制</h3>
      <ul>
        <li>教師密碼只在 Apps Script 後端驗證。</li>
        <li>HTML 不保存教師密碼。</li>
        <li>驗證成功後取得短效 Session Token。</li>
        <li>讀取學生紀錄時必須攜帶有效 Token。</li>
        <li>Token 到期後需重新登入。</li>
      </ul>
    </div>
  </div>`;
  document.getElementById('homeBtn').onclick=()=>location.reload();
  document.getElementById('teacherPassword').addEventListener('keydown',e=>{
    if(e.key==='Enter') document.getElementById('teacherLoginBtn').click();
  });
  document.getElementById('teacherLoginBtn').onclick=async()=>{
    const password=document.getElementById('teacherPassword').value;
    const status=document.getElementById('loginStatus'),btn=document.getElementById('teacherLoginBtn');
    if(!password){status.className='status err';status.textContent='請輸入教師密碼。';return}
    btn.disabled=true;btn.textContent='驗證中…';status.className='status info';status.textContent='正在驗證教師身分…';
    try{
      const res=await fetch(GAS_WEB_APP_URL,{
        method:'POST',
        redirect:'follow',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'teacherLogin',password})
      });
      const data=await res.json();
      if(!res.ok || !data.ok || !data.token) throw new Error(data.message||'驗證失敗');
      teacherState.token=data.token;sfx('success');
      status.className='status ok';status.textContent='✅ 教師驗證成功。';
      teacherDashboard();
    }catch(err){
      sfx('warning');status.className='status err';status.textContent='❌ '+err.message;
      btn.disabled=false;btn.textContent='登入教師端';
    }
  };
}

function teacherDashboard(){
  if(!teacherState.token){teacherLogin();return}
  state.mode='teacher';state.stage=0;sync();
  stopAutoRefresh();
  screen.innerHTML=`
  <div class="kicker">TEACHER LIVE DASHBOARD</div>
  <h2 class="sectionTitle"><span class="liveDot" id="liveDot"></span>教師即時儀表板</h2>

  <div class="toolbar">
    <div class="field"><label>班級篩選</label><input id="classFilter" type="text" placeholder="空白＝全部；例如：高二忠"></div>
    <div class="field"><label>學生搜尋</label><input id="studentFilter" type="text" placeholder="座號或姓名"></div>
    <div class="field"><label>自動更新間隔</label>
      <select id="refreshSeconds"><option value="10">10 秒</option><option value="20">20 秒</option><option value="30">30 秒</option><option value="60">60 秒</option></select>
    </div>
    <label class="switchLabel"><input type="checkbox" id="autoRefresh"> 自動更新</label>
  </div>

  <div class="btnrow">
    <button class="btn primary" id="loadBtn">立即重新整理</button>
    <button class="btn secondary" id="logoutBtn">登出教師端</button>
    <button class="btn ghost" id="homeBtn">回首頁</button>
  </div>

  <div id="teacherStatus" class="status info">正在讀取最新資料…</div>
  <div id="teacherResult"></div>`;

  document.getElementById('homeBtn').onclick=()=>{stopAutoRefresh();location.reload()};
  document.getElementById('logoutBtn').onclick=()=>{stopAutoRefresh();teacherState.token='';teacherLogin()};
  document.getElementById('loadBtn').onclick=loadRecords;
  document.getElementById('classFilter').addEventListener('input',()=>teacherState.lastPayload && renderTeacherPayload(teacherState.lastPayload));
  document.getElementById('studentFilter').addEventListener('input',()=>teacherState.lastPayload && renderTeacherPayload(teacherState.lastPayload));
  document.getElementById('refreshSeconds').onchange=e=>{
    teacherState.refreshSeconds=Number(e.target.value)||10;
    if(teacherState.autoRefresh) startAutoRefresh();
  };
  document.getElementById('autoRefresh').onchange=e=>{
    teacherState.autoRefresh=e.target.checked;
    if(teacherState.autoRefresh) startAutoRefresh(); else stopAutoRefresh(false);
    updateLiveDot();
  };

  loadRecords();
}

function startAutoRefresh(){
  stopAutoRefresh(false);
  teacherState.autoRefresh=true;
  const cb=document.getElementById('autoRefresh'); if(cb) cb.checked=true;
  teacherState.timer=setInterval(()=>loadRecords(true),teacherState.refreshSeconds*1000);
  updateLiveDot();
}
function stopAutoRefresh(reset=true){
  if(teacherState.timer){clearInterval(teacherState.timer);teacherState.timer=null}
  if(reset) teacherState.autoRefresh=false;
  updateLiveDot();
}
function updateLiveDot(){
  const dot=document.getElementById('liveDot');
  if(dot) dot.classList.toggle('on',teacherState.autoRefresh);
}

async function loadRecords(silent=false){
  if(!teacherState.token){teacherLogin();return}
  const status=document.getElementById('teacherStatus'),result=document.getElementById('teacherResult');
  if(!status)return;
  if(!silent){status.className='status info';status.textContent='正在讀取「記錄」工作表…'}
  try{
    const url=GAS_WEB_APP_URL+(GAS_WEB_APP_URL.includes('?')?'&':'?')+
      'action=records&token='+encodeURIComponent(teacherState.token)+'&t='+Date.now();
    const res=await fetch(url,{method:'GET',redirect:'follow',cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data.ok){
      if(data.code==='UNAUTHORIZED'){
        teacherState.token='';stopAutoRefresh();
        throw new Error('教師登入已失效，請重新登入。');
      }
      throw new Error(data.message||'讀取失敗');
    }
    teacherState.lastPayload=data;
    renderTeacherPayload(data);
    const now=new Date().toLocaleTimeString('zh-TW',{hour12:false});
    status.className='status ok';
    status.innerHTML=`✅ 已更新｜${now}｜試算表原始紀錄 ${Number(data.total||0)} 筆`;
  }catch(err){
    status.className='status err';status.innerHTML=`❌ ${esc(err.message)}`;
    if(String(err.message).includes('重新登入')) setTimeout(teacherLogin,700);
  }
}

function latestUnique(records){
  const map=new Map();
  records.forEach((r,idx)=>{
    const key=[r.className||'',r.seat||'',r.name||''].join('||');
    map.set(key,{...r,__rowIndex:idx});
  });
  return [...map.values()];
}

function applyTeacherFilters(records){
  const classEl=document.getElementById('classFilter'), studentEl=document.getElementById('studentFilter');
  const classQ=(classEl?classEl.value:'').trim().toLowerCase();
  const studentQ=(studentEl?studentEl.value:'').trim().toLowerCase();
  return records.filter(r=>
    (!classQ||String(r.className||'').toLowerCase().includes(classQ)) &&
    (!studentQ||(String(r.seat||'')+' '+String(r.name||'')).toLowerCase().includes(studentQ))
  );
}

function counts(rows,key){
  const o={};rows.forEach(r=>{const v=r[key];if(v)o[v]=(o[v]||0)+1});return o;
}
function bossCounts(rows){
  const o={};rows.forEach(r=>String(r.boss||'').split('｜').filter(Boolean).forEach(v=>o[v]=(o[v]||0)+1));return o;
}
function bars(obj){
  const total=Object.values(obj).reduce((a,b)=>a+b,0)||1;
  if(!Object.keys(obj).length)return '<div class="small">尚無資料</div>';
  return `<div class="bars">${Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="barrow"><div>${esc(k)}</div><div class="bar"><span style="width:${Math.round(v/total*100)}%"></span></div><div>${v}</div></div>`).join('')}</div>`;
}
function avg(rows,key){return rows.length?(rows.reduce((s,r)=>s+(Number(r[key])||0),0)/rows.length).toFixed(1):'0.0'}

function rosterForFilter(roster){
  const classEl=document.getElementById('classFilter');
  const classQ=(classEl?classEl.value:'').trim().toLowerCase();
  return (roster||[]).filter(r=>!classQ||String(r.className||'').toLowerCase().includes(classQ));
}

function getUnsubmitted(roster,submitted){
  if(!roster.length)return [];
  const submittedKeys=new Set(submitted.map(r=>[String(r.className||'').trim(),String(r.seat||'').trim()].join('||')));
  return roster.filter(r=>!submittedKeys.has([String(r.className||'').trim(),String(r.seat||'').trim()].join('||')));
}

function renderTeacherPayload(data){
  const uniqueAll=latestUnique(Array.isArray(data.records)?data.records:[]);
  const rows=applyTeacherFilters(uniqueAll);
  const roster=rosterForFilter(Array.isArray(data.roster)?data.roster:[]);
  const unsubmitted=getUnsubmitted(roster,rows);
  const completion=roster.length?Math.round((Math.max(0,roster.length-unsubmitted.length)/roster.length)*100):null;

  const result=document.getElementById('teacherResult');
  if(!result)return;

  result.innerHTML=`
    <div class="dashboardTop">
      <div class="metric"><small>有效學生數</small><b>${rows.length}</b></div>
      <div class="metric"><small>原始提交筆數</small><b>${data.total||0}</b></div>
      <div class="metric"><small>名單人數</small><b>${roster.length||'—'}</b></div>
      <div class="metric"><small>完成率</small><b>${completion===null?'—':completion+'%'}</b></div>
    </div>

    ${roster.length?`
      <div class="box">
        <h3>尚未提交學生（${unsubmitted.length}）</h3>
        <div class="unsubmitted">${unsubmitted.length?unsubmitted.map(r=>`<span class="pill">${esc(r.className||'')} ${esc(r.seat||'')}號 ${esc(r.name||'')}</span>`).join(''):'<span class="good">全員已提交</span>'}</div>
      </div>`:
      `<div class="notice">若要顯示「未提交學生」與完成率，請在同一份試算表建立「名單」工作表，欄位依序為 <b>className、seat、name</b>。</div>`
    }

    <div class="summaryGrid">
      <div class="box"><h3>第一窟選擇</h3>${bars(counts(rows,'cave1'))}</div>
      <div class="box"><h3>第二窟判斷</h3>${bars(counts(rows,'cave2'))}</div>
      <div class="box"><h3>跨文化任務</h3>${bars(counts(rows,'culture'))}</div>
      <div class="box"><h3>人類三窟</h3>${bars(bossCounts(rows))}</div>
    </div>

    <div class="callout"><b>全班平均資源：</b>
      💰 ${avg(rows,'money')}　❤️ ${avg(rows,'people')}　👑 ${avg(rows,'rep')}　🤝 ${avg(rows,'rel')}　🏛️ ${avg(rows,'root')}
    </div>

    <div class="box">
      <h3>學生填答明細</h3>
      <div class="small">若同一位學生重複提交，儀表板以最新一筆為準；原始資料仍保留在「記錄」工作表中。</div>
      <div class="tablewrap"><table class="table">
        <thead><tr><th>時間</th><th>班級</th><th>座號</th><th>姓名</th><th>第一窟</th><th>第二窟</th><th>跨文化</th><th>人類三窟</th><th>第四窟</th><th>詳細</th></tr></thead>
        <tbody>${rows.map((r,i)=>`<tr>
          <td>${esc(r.timestamp||'')}</td><td>${esc(r.className||'')}</td><td>${esc(r.seat||'')}</td><td>${esc(r.name||'')}</td>
          <td>${esc(r.cave1||'')}</td><td>${esc(r.cave2||'')}</td><td>${esc(r.culture||'')}</td>
          <td>${esc(r.boss||'')}</td><td>${esc(r.globalAction||'')}</td>
          <td><button class="btn secondary detailBtn" data-index="${i}">查看</button></td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`;

  document.querySelectorAll('.detailBtn').forEach(btn=>btn.onclick=()=>showStudentDetail(rows[Number(btn.dataset.index)]));
}

function showStudentDetail(r){
  const back=document.createElement('div');back.className='dialogBack';
  back.innerHTML=`
    <div class="dialog" role="dialog" aria-modal="true" aria-label="學生完整作答">
      <div class="btnrow" style="justify-content:space-between;margin-top:0">
        <div><h3>${esc(r.className||'')} ${esc(r.seat||'')}號 ${esc(r.name||'')}</h3><div class="small">${esc(r.timestamp||'')}</div></div>
        <button class="btn ghost closeDialog">關閉</button>
      </div>
      <div class="detailGrid">
        ${detailItem('第一印象',r.firstImpression)}
        ${detailItem('第一窟',r.cave1)}
        ${detailItem('第二窟',r.cave2)}
        ${detailItem('跨文化',r.culture)}
        ${detailItem('國家角色',r.country)}
        ${detailItem('OUR POSITION',r.position)}
        ${detailItem('YOUR NEEDS',r.needs)}
        ${detailItem('COMMON GROUND',r.commonGround)}
        ${detailItem('OUR SOLUTION',r.solution)}
        ${detailItem('人類三窟',r.boss)}
        ${detailItem('Boss 理由',r.bossReason)}
        ${detailItem('我的青春三窟',r.youthCaves)}
        ${detailItem('第四窟',r.globalAction)}
        ${detailItem('策略幣配置',`黃金 ${r.gold||0}／軍隊 ${r.army||0}／豪宅 ${r.house||0}／宗廟 ${r.temple||0}／民生 ${r.welfare||0}／外交 ${r.diplomacy||0}`)}
        ${detailItem('最終資源',`財富 ${r.money||0}／民心 ${r.people||0}／聲望 ${r.rep||0}／關係 ${r.rel||0}／根基 ${r.root||0}`)}
      </div>
    </div>`;
  document.body.appendChild(back);
  const close=()=>back.remove();
  back.querySelector('.closeDialog').onclick=close;
  back.onclick=e=>{if(e.target===back)close()};
}
function detailItem(label,value){
  return `<div class="detailItem"><small>${esc(label)}</small><b>${esc(value===undefined||value===null?'':value)}</b></div>`;
}
function render(){
  sync();
  [home,identity,intro,cave1,crisis,cave2,cave3,culture,negotiation,boss,youthCaves,action,submitPage][state.stage]();
}
render();
})();
</script>
</body>
</html>
